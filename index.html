<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집밥 레시피 아이디어</title>

<style>
  /* ============================================================
     Ant Design Mobile (antd-mobile) tokens — baby yellow theme
     All text/bg pairs pass WCAG 2.1 AA (≥ 4.5:1):
       #3D3000 on #FFF9C4  ≈ 12.0:1   (title on page bg)
       #3D3000 on #FFD633  ≈  9.1:1   (primary button)
       #6B5500 on #FFF9C4  ≈  6.7:1   (active tab / accents)
       #6B5500 on #FFF3B0  ≈  6.4:1   (badge)
       #666666 on #FFFFFF  ≈  5.7:1   (memo on card)
     ============================================================ */
  :root {
    --adm-color-primary: #FFD633;          /* baby yellow fill */
    --adm-color-on-primary: #3D3000;       /* dark text on yellow */
    --adm-color-accent: #6B5500;           /* dark gold — AA on yellow bg */
    --adm-color-text: #1A1A1A;
    --adm-color-text-secondary: #666666;
    --adm-color-background: #F5F5F5;       /* gray-1 page bg */
    --adm-color-box: #FFFFFF;              /* card / input surface */
    --adm-color-badge-bg: #FFF3B0;
    --adm-color-border: #E5E5E5;
    --adm-font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
      "Apple SD Gothic Neo", "Noto Sans KR", Tahoma, Arial, sans-serif;
    --adm-radius-s: 4px;    /* button */
    --adm-radius-m: 6px;    /* search bar */
    --adm-radius-l: 8px;    /* card */
  }

  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    padding: 16px 12px 48px;
    max-width: 480px;
    background: var(--adm-color-background);
    color: var(--adm-color-text);
    font-family: var(--adm-font-family);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 8px 4px 16px;
  }
  .head-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--adm-color-text);
    margin: 0;
  }

  /* adm-button — small, secondary (header) */
  .add-btn {
    flex-shrink: 0;
    font-family: var(--adm-font-family);
    font-size: 13px;
    font-weight: 600;
    color: var(--adm-color-text);
    background: var(--adm-color-box);
    border: 1px solid #CCCCCC;
    border-radius: var(--adm-radius-s);
    padding: 6px 10px;
    min-height: 32px;
    cursor: pointer;
  }
  .add-btn:active { background: #F0F0F0; }

  /* adm-search-bar */
  .search {
    width: 100%;
    height: 40px;
    font-family: var(--adm-font-family);
    font-size: 15px;
    color: var(--adm-color-text);
    background: var(--adm-color-box);
    border: 1px solid var(--adm-color-border);
    border-radius: var(--adm-radius-m);
    padding: 0 12px;
    margin-bottom: 8px;
  }
  .search:focus {
    outline: 2px solid var(--adm-color-accent);
    outline-offset: 1px;
  }
  .search::placeholder { color: #757575; }

  /* adm-tabs — underline indicator style */
  .tabs {
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin: 0 0 16px;
    border-bottom: 1px solid var(--adm-color-border);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex-shrink: 0;
    font-family: var(--adm-font-family);
    font-size: 15px;
    color: var(--adm-color-text-secondary);
    background: transparent;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 10px 12px;
    cursor: pointer;
  }
  .tabs button.active {
    color: var(--adm-color-accent);
    font-weight: 700;
    border-bottom-color: var(--adm-color-accent);
  }

  /* Result count (search mode) */
  .count {
    font-size: 13px;
    color: #5C5C5C;
    margin: 0 4px 12px;
  }

  /* adm-card */
  .card {
    background: var(--adm-color-box);
    border-radius: var(--adm-radius-l);
    padding: 12px;
    margin-bottom: 12px;
  }

  /* Card header row: title left, badge right */
  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  /* Card title */
  .card h3 {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    margin: 0;
  }

  /* adm-tag */
  .tag {
    flex-shrink: 0;
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--adm-color-accent);
    background: var(--adm-color-badge-bg);
    border-radius: var(--adm-radius-s);
    padding: 2px 8px;
  }

  /* memo — sits right under the title */
  .card p {
    font-size: 13px;
    line-height: 1.5;
    color: var(--adm-color-text-secondary);
    margin: 6px 0 0;
  }

  /* links stack full-width; 16px gap above the first button */
  .card a {
    display: block;
    text-decoration: none;
    margin-top: 8px;
  }
  .card a:first-of-type { margin-top: 16px; }

  /* adm-button — color primary, block (full-width) */
  .card button {
    width: 100%;
    font-family: var(--adm-font-family);
    font-size: 14px;
    font-weight: 600;
    color: var(--adm-color-on-primary);
    background: var(--adm-color-primary);
    border: 1px solid var(--adm-color-primary);
    border-radius: var(--adm-radius-s);
    padding: 8px 12px;
    min-height: 36px;
    cursor: pointer;
  }
  .card button:active {
    background: #F0C420;
    border-color: #F0C420;
  }

  /* adm-popup — bottom sheet */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .sheet {
    width: 100%;
    max-width: 480px;
    background: var(--adm-color-box);
    border-radius: 12px 12px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet h2 {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 16px;
  }
  .sheet label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #5C5C5C;
    margin: 12px 0 4px;
  }
  .sheet input,
  .sheet textarea,
  .sheet select {
    width: 100%;
    font-family: var(--adm-font-family);
    font-size: 15px;
    color: var(--adm-color-text);
    background: #FAFAFA;
    border: 1px solid var(--adm-color-border);
    border-radius: var(--adm-radius-m);
    padding: 10px 12px;
  }
  .sheet textarea { resize: vertical; min-height: 64px; }
  .sheet input:focus, .sheet textarea:focus, .sheet select:focus {
    outline: 2px solid var(--adm-color-accent);
    outline-offset: 1px;
  }
  .sheet .err {
    font-size: 13px;
    color: #C0392B;
    margin: 12px 0 0;
    display: none;
  }
  .sheet-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  .sheet-actions button {
    flex: 1;
    font-family: var(--adm-font-family);
    font-size: 15px;
    font-weight: 600;
    border-radius: var(--adm-radius-s);
    padding: 10px 12px;
    min-height: 44px;
    cursor: pointer;
  }
  .btn-save {
    color: var(--adm-color-on-primary);
    background: var(--adm-color-primary);
    border: 1px solid var(--adm-color-primary);
  }
  .btn-save:active { background: #F0C420; border-color: #F0C420; }
  .btn-cancel {
    color: var(--adm-color-text);
    background: var(--adm-color-box);
    border: 1px solid #CCCCCC;
  }
</style>
</head>
<body>

<div class="page-head">
  <h1 id="title">집밥 레시피 아이디어</h1>
  <div class="head-actions">
    <button class="add-btn" id="lang-btn" aria-label="Switch language">EN</button>
    <button class="add-btn" id="add-btn">＋ 레시피 추가</button>
  </div>
</div>

<input type="search" id="search" class="search" placeholder="레시피 검색 (예: 두부, 김밥, 파스타)">

<nav class="tabs" id="tabs"></nav>

<p class="count" id="count" hidden></p>

<main id="board"></main>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-labelledby="sheet-title">
    <h2 id="sheet-title">새 레시피 추가</h2>

    <label for="f-name" id="l-name">레시피 이름</label>
    <input id="f-name" type="text" placeholder="예: 두부크림파스타">

    <label for="f-link" id="l-link">링크</label>
    <input id="f-link" type="url" placeholder="https:// 링크 붙여넣기">

    <label for="f-memo" id="l-memo">메모 (선택)</label>
    <textarea id="f-memo" placeholder="예: 와인은 없으면 제외"></textarea>

    <label for="f-cat" id="l-cat">카테고리</label>
    <select id="f-cat"></select>

    <p class="err" id="f-err">이름과 링크를 입력해 주세요.</p>

    <div class="sheet-actions">
      <button class="btn-cancel" id="f-cancel">취소</button>
      <button class="btn-save" id="f-save">저장</button>
    </div>
  </div>
</div>

const STORE_KEY = "recipe-board-custom";
function loadCustom() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch (e) { return []; }
}
function saveCustom(list) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch (e) {}
}
let CUSTOM = loadCustom();
const allRecipes = () => RECIPES.concat(CUSTOM);

function linkLabel(url) {
  if (/instagram\.com/.test(url)) return "Instagram";
  if (/youtu\.?be/.test(url)) return "YouTube";
  if (/blog\.naver\.com/.test(url)) return "Blog";
  if (/(^|\.)x\.com|twitter\.com/.test(url)) return "X";
  return "Link";
}

/* --- i18n --- */
const I18N = {
  ko: {
    title: "집밥 레시피 아이디어",
    addBtn: "＋ 레시피 추가",
    langBtn: "EN",
    searchPh: "레시피 검색 (예: 두부, 김밥, 파스타)",
    memoPrefix: "메모: ",
    sheetTitle: "새 레시피 추가",
    lblName: "레시피 이름", phName: "예: 두부크림파스타",
    lblLink: "링크", phLink: "https:// 링크 붙여넣기",
    lblMemo: "메모 (선택)", phMemo: "예: 와인은 없으면 제외",
    lblCat: "카테고리",
    cancel: "취소", save: "저장",
    errRequired: "이름과 링크를 입력해 주세요.",
    errUrl: "링크는 http:// 또는 https:// 로 시작해야 해요.",
    count: (q, n) => "\"" + q + "\" 검색 결과 " + n + "개",
  },
  en: {
    title: "Home Cooking Recipe Ideas",
    addBtn: "＋ Add Recipe",
    langBtn: "한국어",
    searchPh: "Search recipes (e.g. tofu, gimbap, pasta)",
    memoPrefix: "Note: ",
    sheetTitle: "Add a New Recipe",
    lblName: "Recipe name", phName: "e.g. Tofu Cream Pasta",
    lblLink: "Link", phLink: "Paste an https:// link",
    lblMemo: "Note (optional)", phMemo: "e.g. skip wine if unavailable",
    lblCat: "Category",
    cancel: "Cancel", save: "Save",
    errRequired: "Please enter a name and a link.",
    errUrl: "The link must start with http:// or https://.",
    count: (q, n) => n + " result" + (n === 1 ? "" : "s") + " for \"" + q + "\"",
  },
};

const LANG_KEY = "recipe-board-lang";
const state = { activeCat: "chicken", query: "", lang: localStorage.getItem(LANG_KEY) || "ko" };
const t = () => I18N[state.lang];
const rName = r => (state.lang === "en" && r.nameEn) ? r.nameEn : r.name;
const rNote = r => (state.lang === "en" && r.noteEn) ? r.noteEn : r.note;
const lLabel = l => (state.lang === "en" && l.labelEn) ? l.labelEn : l.label;
const catLabel = id => CATEGORIES.find(c => c.id === id).label;

function applyLang() {
  document.documentElement.lang = state.lang;
  document.title = t().title;
  document.getElementById("title").textContent = t().title;
  document.getElementById("add-btn").textContent = t().addBtn;
  document.getElementById("lang-btn").textContent = t().langBtn;
  document.getElementById("search").placeholder = t().searchPh;
  document.getElementById("sheet-title").textContent = t().sheetTitle;
  document.getElementById("l-name").textContent = t().lblName;
  document.getElementById("f-name").placeholder = t().phName;
  document.getElementById("l-link").textContent = t().lblLink;
  document.getElementById("f-link").placeholder = t().phLink;
  document.getElementById("l-memo").textContent = t().lblMemo;
  document.getElementById("f-memo").placeholder = t().phMemo;
  document.getElementById("l-cat").textContent = t().lblCat;
  document.getElementById("f-cancel").textContent = t().cancel;
  document.getElementById("f-save").textContent = t().save;
}

function makeCard(r) {
  const card = document.createElement("article");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "card-head";

  const name = document.createElement("h3");
  name.textContent = rName(r);
  head.appendChild(name);

  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = catLabel(r.category);
  head.appendChild(tag);

  card.appendChild(head);

  if (r.note) {
    const note = document.createElement("p");
    note.textContent = t().memoPrefix + rNote(r);
    card.appendChild(note);
  }

  r.links.forEach(l => {
    const a = document.createElement("a");
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener";
    const btn = document.createElement("button");
    btn.textContent = "🔗 " + lLabel(l);
    a.appendChild(btn);
    card.appendChild(a);
  });

  return card;
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const n = allRecipes().filter(r => r.category === cat.id).length;
    const btn = document.createElement("button");
    btn.textContent = cat.label + " " + n;
    btn.className = (!state.query && cat.id === state.activeCat) ? "active" : "";
    btn.addEventListener("click", () => {
      state.activeCat = cat.id;
      state.query = "";
      document.getElementById("search").value = "";
      render();
    });
    tabs.appendChild(btn);
  });
}

function render() {
  renderTabs();

  const board = document.getElementById("board");
  const count = document.getElementById("count");
  board.innerHTML = "";

  let list;
  if (state.query) {
    const q = state.query.toLowerCase();
    list = allRecipes().filter(r =>
      r.name.toLowerCase().includes(q) ||
      (r.nameEn || "").toLowerCase().includes(q) ||
      (r.note || "").toLowerCase().includes(q) ||
      (r.noteEn || "").toLowerCase().includes(q) ||
      catLabel(r.category).toLowerCase().includes(q)
    );
    count.hidden = false;
    count.textContent = t().count(state.query, list.length);
  } else {
    list = allRecipes().filter(r => r.category === state.activeCat);
    count.hidden = true;
  }

  list.forEach(r => board.appendChild(makeCard(r)));
}

document.getElementById("search").addEventListener("input", e => {
  state.query = e.target.value.trim();
  render();
});

/* --- Add recipe sheet --- */
const overlay = document.getElementById("overlay");
const catSelect = document.getElementById("f-cat");
CATEGORIES.forEach(cat => {
  const opt = document.createElement("option");
  opt.value = cat.id;
  opt.textContent = cat.label;
  catSelect.appendChild(opt);
});

function openSheet() {
  document.getElementById("f-name").value = "";
  document.getElementById("f-link").value = "";
  document.getElementById("f-memo").value = "";
  catSelect.value = state.activeCat;
  document.getElementById("f-err").style.display = "none";
  overlay.hidden = false;
  document.getElementById("f-name").focus();
}
function closeSheet() { overlay.hidden = true; }

document.getElementById("add-btn").addEventListener("click", openSheet);
document.getElementById("f-cancel").addEventListener("click", closeSheet);
overlay.addEventListener("click", e => { if (e.target === overlay) closeSheet(); });

document.getElementById("f-save").addEventListener("click", () => {
  const name = document.getElementById("f-name").value.trim();
  const url = document.getElementById("f-link").value.trim();
  const memo = document.getElementById("f-memo").value.trim();
  const cat = catSelect.value;

  if (!name || !url || !/^https?:\/\//.test(url)) {
    const err = document.getElementById("f-err");
    err.textContent = (!name || !url) ? t().errRequired : t().errUrl;
    err.style.display = "block";
    return;
  }

  const recipe = { name, category: cat, links: [{ label: linkLabel(url), url }] };
  if (memo) recipe.note = memo;
  CUSTOM.push(recipe);
  saveCustom(CUSTOM);

  state.activeCat = cat;
  state.query = "";
  document.getElementById("search").value = "";
  closeSheet();
  render();
});

/* --- Language toggle --- */
document.getElementById("lang-btn").addEventListener("click", () => {
  state.lang = state.lang === "ko" ? "en" : "ko";
  try { localStorage.setItem(LANG_KEY, state.lang); } catch (e) {}
  applyLang();
  render();
});

applyLang();
render();
</script>
