<style>
  /* ============================================================
     Ant Design Mobile (antd-mobile) tokens — baby yellow theme
     All text/bg pairs pass WCAG 2.1 AA (≥ 4.5:1):
       #3D3000 on #FFF9C4  ≈ 12.0:1   (title on page bg)
       #3D3000 on #FFD633  ≈  9.1:1   (primary button)
       #6B5500 on #FFF9C4  ≈  6.7:1   (active tab / accents)
       #6B5500 on #FFF3B0  ≈  6.4:1   (badge)
       #666666 on #FFFFFF  ≈  5.7:1   (memo on card)
     ============================================================ */
  :root {
    --adm-color-primary: #FFD633;          /* baby yellow fill */
    --adm-color-on-primary: #3D3000;       /* dark text on yellow */
    --adm-color-accent: #6B5500;           /* dark gold — AA on yellow bg */
    --adm-color-text: #1A1A1A;
    --adm-color-text-secondary: #666666;
    --adm-color-background: #F5F5F5;       /* gray-1 page bg */
    --adm-color-box: #FFFFFF;              /* card / input surface */
    --adm-color-badge-bg: #FFF3B0;
    --adm-color-border: #E5E5E5;
    /* Latin: Roboto / Hangul: SUIT Variable */
    --adm-font-family: "Roboto", "SUIT Variable", -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Noto Sans KR", Tahoma, Arial, sans-serif;
    /* Latin: Stack Sans / Hangul: Chiron GoRound TC → SUIT fallback */
    --adm-font-head: "Stack Sans Text", "Chiron GoRound TC", "SUIT Variable",
      -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --adm-radius-s: 4px;    /* button */
    --adm-radius-m: 6px;    /* search bar */
    --adm-radius-l: 8px;    /* card */
  }

  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    padding: 12px 16px 48px;
    max-width: 480px;
    background: var(--adm-color-background);
    color: var(--adm-color-text);
    font-family: var(--adm-font-family);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  /* Header — logo left, KR + add buttons right (Figma 3:171) */
  .top-bar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .logo {
    width: 52px;
    height: 52px;
    object-fit: contain;
  }
  .head-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn-lang {
    height: 40px;
    padding: 0 12px;
    font-family: var(--adm-font-family);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.16px;
    color: #333333;
    background: #FFFFFF;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }
  .btn-lang:active { background: #F0F0F0; }
  .btn-add {
    width: 40px;
    height: 40px;
    background: #FFEC3D;
    border: 0;
    border-radius: 99999px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn-add:active { background: #F0DC1F; }
  .btn-add img { width: 24px; height: 24px; }

  /* Title — Stack Sans Headline Bold 24 (Figma 3:180) */
  h1 {
    font-family: "Stack Sans Headline", var(--adm-font-head);
    font-size: 24px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.24px;
    color: #212121;
    white-space: pre-line;
    margin: 8px 0 0;
  }

  /* Search bar — white pill, icon inside (Figma 3:18) */
  .search-wrap {
    position: relative;
    margin-top: 24px;
  }
  .search-icon {
    position: absolute;
    left: 16px;
    top: 12px;
    width: 24px;
    height: 24px;
    pointer-events: none;
  }
  .search {
    width: 100%;
    height: 48px;
    font-family: var(--adm-font-family);
    font-size: 16px;
    letter-spacing: -0.16px;
    color: var(--adm-color-text);
    background: #FFFFFF;
    border: 0;
    border-radius: 16px;
    padding: 0 16px 0 48px;
  }
  .search:focus {
    outline: 2px solid #212121;
    outline-offset: 1px;
  }
  .search::placeholder { color: #9F9F9F; }

  /* Tabs — pill style, active = dark (Figma 3:258) */
  .tabs-wrap {
    display: flex;
    align-items: center;
    margin-top: 12px;
  }
  .tab-arrow {
    flex-shrink: 0;
    width: 32px;
    height: 40px;
    background: transparent;
    border: 0;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tab-arrow img { width: 20px; height: 20px; }
  .tab-arrow:disabled {
    opacity: 0.25;
    cursor: default;
  }
  .tabs {
    flex: 1;
    min-width: 0;
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex-shrink: 0;
    height: 40px;
    padding: 0 16px;
    font-family: var(--adm-font-family);
    font-size: 16px;
    font-weight: 400;
    letter-spacing: -0.16px;
    color: #757575;
    background: transparent;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }
  .tabs button.active {
    background: #333333;
    color: #FFFFFF;
    font-weight: 700;
  }

  /* Result count (search mode) */
  .count {
    font-size: 13px;
    color: #5C5C5C;
    margin: 12px 4px 0;
  }

  /* Card container (Figma 1:113: pt 12) */
  #board { margin-top: 12px; }

  /* Card — Figma spec: node 3:309 (whole card is the link) */
  .card {
    display: block;
    position: relative;
    background: #FFFFFF;
    border-radius: 24px;
    padding: 20px 16px;
    margin-bottom: 8px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .card:active { background: #FAFAFA; }

  /* category emoji badge — 48px circle */
  .card-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 99999px;
    font-size: 24px;
    line-height: 1.2;
    margin-bottom: 16px;
  }

  /* title — Stack Sans Headline Bold 16 */
  .card h3 {
    font-family: "Stack Sans Headline", var(--adm-font-head);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.16px;
    color: #212121;
    margin: 0;
  }

  /* note — Roboto Regular 13 */
  .card p {
    font-size: 13px;
    font-weight: 400;
    line-height: 1.35;
    letter-spacing: -0.065px;
    color: #757575;
    margin: 8px 0 0;
  }

  /* outbound arrow — 48px hit area pinned to the top-right corner */
  .card-arrow {
    position: absolute;
    top: 0;
    right: 0;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* adm-back-to-top — floating button, shows once the header scrolls away */
  .top-btn {
    position: fixed;
    bottom: 24px;
    right: 16px;
    width: 44px;
    height: 44px;
    font-size: 20px;
    line-height: 1;
    color: var(--adm-color-text);
    background: var(--adm-color-box);
    border: 1px solid var(--adm-color-border);
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 5;
  }
  .top-btn.show {
    opacity: 1;
    pointer-events: auto;
  }
  .top-btn img { width: 24px; height: 24px; }
  @media (min-width: 480px) {
    .top-btn { right: calc(50% - 240px + 16px); }
  }

  /* adm-popup — bottom sheet */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .sheet {
    width: 100%;
    max-width: 480px;
    background: var(--adm-color-box);
    border-radius: 12px 12px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet h2 {
    font-family: var(--adm-font-head);
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 16px;
  }
  .sheet label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #5C5C5C;
    margin: 12px 0 4px;
  }
  .sheet input,
  .sheet textarea,
  .sheet select {
    width: 100%;
    font-family: var(--adm-font-family);
    /* 16px+ prevents iOS Safari's auto-zoom on focus (which caused
       the horizontal scroll) */
    font-size: 16px;
    color: var(--adm-color-text);
    background: #FAFAFA;
    border: 1px solid var(--adm-color-border);
    border-radius: var(--adm-radius-m);
    padding: 10px 12px;
  }
  .sheet textarea { resize: vertical; min-height: 64px; }
  .sheet input:focus, .sheet textarea:focus, .sheet select:focus {
    outline: 2px solid var(--adm-color-accent);
    outline-offset: 1px;
  }
  .sheet .err {
    font-size: 13px;
    color: #C0392B;
    margin: 12px 0 0;
    display: none;
  }
  .sheet-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  .sheet-actions button {
    flex: 1;
    font-family: var(--adm-font-family);
    font-size: 15px;
    font-weight: 500;
    border-radius: var(--adm-radius-s);
    padding: 10px 12px;
    min-height: 44px;
    cursor: pointer;
  }
  .sheet-actions button { border-radius: 12px; }
  .btn-save {
    color: #333333;
    background: #FFEC3D;
    border: 0;
  }
  .btn-save:active { background: #F0DC1F; }
  .btn-cancel {
    color: var(--adm-color-text);
    background: var(--adm-color-box);
    border: 1px solid #CCCCCC;
  }
</style>
</head>
<body>

<header class="top-bar">
  <img class="logo" src="assets/logo.png" alt="Random Recipe Board logo">
  <div class="head-actions">
    <button class="btn-lang" id="lang-btn" aria-label="Switch language">EN</button>
    <button class="btn-add" id="add-btn" aria-label="Add recipe"><img src="assets/plus.svg" alt=""></button>
  </div>
</header>

<h1 id="title">Random
Recipe Board</h1>

<div class="search-wrap">
  <img class="search-icon" src="assets/search.svg" alt="">
  <input type="search" id="search" class="search" placeholder="Search a keyword in KR or ENG">
</div>

<div class="tabs-wrap">
  <button class="tab-arrow" id="tab-prev" aria-label="Scroll tabs left"><img src="assets/chevron-left.svg" alt=""></button>
  <nav class="tabs" id="tabs"></nav>
  <button class="tab-arrow" id="tab-next" aria-label="Scroll tabs right"><img src="assets/chevron-right.svg" alt=""></button>
</div>

<p class="count" id="count" hidden></p>

<main id="board"></main>

<button class="top-btn" id="top-btn" aria-label="Back to top"><img src="assets/chevron-up.svg" alt=""></button>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-labelledby="sheet-title">
    <h2 id="sheet-title">새 레시피 추가</h2>

    <label for="f-name" id="l-name">레시피 이름</label>
    <input id="f-name" type="text" placeholder="예: 두부크림파스타">

    <label for="f-link" id="l-link">링크</label>
    <input id="f-link" type="url" placeholder="https:// 링크 붙여넣기">

    <label for="f-memo" id="l-memo">메모 (선택)</label>
    <textarea id="f-memo" placeholder="예: 와인은 없으면 제외"></textarea>

    <label for="f-cat" id="l-cat">카테고리</label>
    <select id="f-cat"></select>

    <p class="err" id="f-err">이름과 링크를 입력해 주세요.</p>

    <div class="sheet-actions">
      <button class="btn-cancel" id="f-cancel">취소</button>
      <button class="btn-save" id="f-save">저장</button>
    </div>
  </div>
</div>

/* Shared recipes live in the DB (Neon Postgres via /api/recipes).
   CUSTOM is newest-first and shown above the built-in recipes. */
let CUSTOM = [];
const allRecipes = () => CUSTOM.concat(RECIPES);

async function loadShared() {
  try {
    const res = await fetch("/api/recipes");
    if (!res.ok) return;
    CUSTOM = await res.json();
    render();
  } catch (e) { /* offline or local file — board still shows built-in recipes */ }
}

function linkLabel(url) {
  if (/instagram\.com/.test(url)) return "Instagram";
  if (/youtu\.?be/.test(url)) return "YouTube";
  if (/blog\.naver\.com/.test(url)) return "Blog";
  if (/(^|\.)x\.com|twitter\.com/.test(url)) return "X";
  return "Link";
}

const LANG_KEY = "recipe-board-lang";
const state = { activeCat: "all", query: "", lang: localStorage.getItem(LANG_KEY) || "ko" };
const t = () => I18N[state.lang];
const rName = r => (state.lang === "en" && r.nameEn) ? r.nameEn : r.name;
const rNote = r => (state.lang === "en" && r.noteEn) ? r.noteEn : r.note;
const lLabel = l => (state.lang === "en" && l.labelEn) ? l.labelEn : l.label;
const catOf = id => CATEGORIES.find(c => c.id === id);
const catText = c => state.lang === "ko" ? c.labelKo : c.label;
/* for search matching — includes EN + KO labels */
const catLabel = id => { const c = catOf(id); return c ? c.emoji + " " + c.label + " " + c.labelKo : id; };

function applyLang() {
  document.documentElement.lang = state.lang;
  document.title = t().title.replace("\n", " ");
  document.getElementById("title").textContent = t().title;
  document.getElementById("add-btn").setAttribute("aria-label", t().addLabel);
  document.getElementById("lang-btn").textContent = t().langBtn;
  document.getElementById("search").placeholder = t().searchPh;
  document.getElementById("sheet-title").textContent = t().sheetTitle;
  document.getElementById("l-name").textContent = t().lblName;
  document.getElementById("f-name").placeholder = t().phName;
  document.getElementById("l-link").textContent = t().lblLink;
  document.getElementById("f-link").placeholder = t().phLink;
  document.getElementById("l-memo").textContent = t().lblMemo;
  document.getElementById("f-memo").placeholder = t().phMemo;
  document.getElementById("l-cat").textContent = t().lblCat;
  document.getElementById("f-cancel").textContent = t().cancel;
  document.getElementById("f-save").textContent = t().save;
  if (typeof refreshCatOptions === "function") refreshCatOptions();
}

const ARROW_SVG = '<img src="assets/up-right.svg" alt="" width="24" height="24">';

function makeCard(r) {
  const cat = catOf(r.category) || {};
  const link = r.links && r.links[0];

  // Whole card is the link (Figma: arrow marks it as outbound)
  const card = document.createElement("a");
  card.className = "card";
  if (link) {
    card.href = link.url;
    card.target = "_blank";
    card.rel = "noopener";
  }

  const badge = document.createElement("span");
  badge.className = "card-badge";
  badge.style.background = cat.badge || "#F5F5F5";
  badge.textContent = cat.emoji || "🍽";
  card.appendChild(badge);

  const name = document.createElement("h3");
  name.textContent = rName(r);
  card.appendChild(name);

  if (r.note) {
    const note = document.createElement("p");
    note.textContent = rNote(r);
    card.appendChild(note);
  }

  const arrow = document.createElement("span");
  arrow.className = "card-arrow";
  arrow.innerHTML = ARROW_SVG;
  card.appendChild(arrow);

  return card;
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  const items = [{ id: "all", label: t().all, emoji: "" }].concat(CATEGORIES);
  items.forEach(cat => {
    const btn = document.createElement("button");
    btn.textContent = (cat.emoji ? cat.emoji + " " : "") +
      (cat.id === "all" ? cat.label : catText(cat));
    btn.className = (!state.query && cat.id === state.activeCat) ? "active" : "";
    btn.addEventListener("click", () => {
      state.activeCat = cat.id;
      state.query = "";
      document.getElementById("search").value = "";
      render();
    });
    tabs.appendChild(btn);
  });
  updateArrows();
}

function render() {
  renderTabs();

  const board = document.getElementById("board");
  const count = document.getElementById("count");
  board.innerHTML = "";

  let list;
  if (state.query) {
    const q = state.query.toLowerCase();
    list = allRecipes().filter(r =>
      r.name.toLowerCase().includes(q) ||
      (r.nameEn || "").toLowerCase().includes(q) ||
      (r.note || "").toLowerCase().includes(q) ||
      (r.noteEn || "").toLowerCase().includes(q) ||
      catLabel(r.category).toLowerCase().includes(q)
    );
    count.hidden = false;
    count.textContent = t().count(state.query, list.length);
  } else {
    list = state.activeCat === "all"
      ? allRecipes()
      : allRecipes().filter(r => r.category === state.activeCat);
    count.hidden = true;
  }

  list.forEach(r => board.appendChild(makeCard(r)));
}

document.getElementById("search").addEventListener("input", e => {
  state.query = e.target.value.trim();
  render();
});

/* --- Add recipe sheet --- */
const overlay = document.getElementById("overlay");
const catSelect = document.getElementById("f-cat");
function refreshCatOptions() {
  const prev = catSelect.value;
  catSelect.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat.id;
    opt.textContent = cat.emoji + " " + catText(cat);
    catSelect.appendChild(opt);
  });
  if (prev) catSelect.value = prev;
}
refreshCatOptions();

function openSheet() {
  document.getElementById("f-name").value = "";
  document.getElementById("f-link").value = "";
  document.getElementById("f-memo").value = "";
  catSelect.value = catOf(state.activeCat) ? state.activeCat : "chicken";
  document.getElementById("f-err").style.display = "none";
  overlay.hidden = false;
  document.getElementById("f-name").focus();
}
function closeSheet() { overlay.hidden = true; }

document.getElementById("add-btn").addEventListener("click", openSheet);
document.getElementById("f-cancel").addEventListener("click", closeSheet);
overlay.addEventListener("click", e => { if (e.target === overlay) closeSheet(); });

document.getElementById("f-save").addEventListener("click", async () => {
  const name = document.getElementById("f-name").value.trim();
  const url = document.getElementById("f-link").value.trim();
  const memo = document.getElementById("f-memo").value.trim();
  const cat = catSelect.value;
  const err = document.getElementById("f-err");
  const saveBtn = document.getElementById("f-save");

  if (!name || !url || !/^https?:\/\//.test(url)) {
    err.textContent = (!name || !url) ? t().errRequired : t().errUrl;
    err.style.display = "block";
    return;
  }

  saveBtn.disabled = true;
  err.style.display = "none";
  try {
    const res = await fetch("/api/recipes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, category: cat, note: memo || null, url }),
    });
    if (!res.ok) throw new Error("save failed");
    const row = await res.json();
    CUSTOM.unshift(row);

    state.activeCat = cat;
    state.query = "";
    document.getElementById("search").value = "";
    closeSheet();
    render();
  } catch (e) {
    err.textContent = t().errServer;
    err.style.display = "block";
  } finally {
    saveBtn.disabled = false;
  }
});

/* --- Tab scroll arrows --- */
const tabsEl = document.getElementById("tabs");
const tabPrev = document.getElementById("tab-prev");
const tabNext = document.getElementById("tab-next");

function updateArrows() {
  tabPrev.disabled = tabsEl.scrollLeft <= 0;
  tabNext.disabled = tabsEl.scrollLeft + tabsEl.clientWidth >= tabsEl.scrollWidth - 1;
}
tabPrev.addEventListener("click", () => tabsEl.scrollBy({ left: -160 }));
tabNext.addEventListener("click", () => tabsEl.scrollBy({ left: 160 }));
tabsEl.addEventListener("scroll", updateArrows);
window.addEventListener("resize", updateArrows);

/* --- Back to top --- */
const topBtn = document.getElementById("top-btn");
const titleEl = document.getElementById("title");
window.addEventListener("scroll", () => {
  topBtn.classList.toggle("show", window.scrollY > titleEl.offsetTop + titleEl.offsetHeight);
}, { passive: true });
topBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

/* --- Language toggle --- */
document.getElementById("lang-btn").addEventListener("click", () => {
  state.lang = state.lang === "ko" ? "en" : "ko";
  try { localStorage.setItem(LANG_KEY, state.lang); } catch (e) {}
  applyLang();
  render();
});

applyLang();
render();
loadShared();
</script>
